spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kanteelite}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres1}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# REQUIRED in production: set JWT_SECRET env var to a long random string (e.g., openssl rand -hex 64)
jwt.secret=${JWT_SECRET:kanteelite-super-secret-jwt-key-that-is-long-enough-for-hs256}
jwt.expiration=86400000

stripe.secret=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
payment.pending-expiration-minutes=${PAYMENT_PENDING_EXPIRATION_MINUTES:30}
payment.pending-cleanup-interval-ms=${PAYMENT_PENDING_CLEANUP_INTERVAL_MS:300000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

server.port=${PORT:8080}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
