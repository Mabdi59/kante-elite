spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kanteelite}
spring.datasource.username=${DB_USERNAME:kanteelite}
spring.datasource.password=${DB_PASSWORD:kanteelite}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:kanteelite-super-secret-jwt-key-that-is-long-enough-for-hs256}
jwt.expiration=86400000

stripe.secret=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

server.port=${PORT:8080}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
