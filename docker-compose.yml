version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kanteelite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kanteelite
      POSTGRES_USER: kanteelite
      POSTGRES_PASSWORD: kanteelite
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kanteelite']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
